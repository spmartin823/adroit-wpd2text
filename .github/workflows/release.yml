name: Build and publish wheels

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested wheels to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1 wheel==0.48.0 setuptools==84.0.0
      - run: bash scripts/build-linux-wheel.sh ${{ matrix.architecture }}
      - run: python -m pip install dist/*.whl
      - run: python -c "from pathlib import Path; from adroit_wpd2text import extract_text; assert 'AND FURTHER' in extract_text(Path('tests/wordperfect.wpd').read_bytes())"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.architecture }}
          path: dist/*.whl

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install libwpd
      - run: python -m pip install build==1.6.1 wheel==0.48.0 setuptools==84.0.0
      - run: python scripts/build-macos-wheel.py ${{ matrix.architecture }}
      - run: python -m pip install dist/*.whl
      - run: python -c "from pathlib import Path; from adroit_wpd2text import extract_text; assert 'AND FURTHER' in extract_text(Path('tests/wordperfect.wpd').read_bytes())"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.architecture }}
          path: dist/*.whl

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
